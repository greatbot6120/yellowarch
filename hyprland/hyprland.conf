exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec='/home/greatbot/.config/scripts/initial-setup.sh > /home/greatbot/.config/scripts/setup.log 2&>1'
exec-once=hyprpaper
exec-once=wl-gammarelay-rs

source = $HOME/.config/hypr/conf/bindings.conf
# laptop screen
#monitor=eDP-1,1920x1080@69,0x0,1

#poliProiettore
#monitor=HDMI-A-1,1920x1080@60,0x0,1

#poulMonitor
#monitor=HDMI-A-1,3840x2160@30,0x0,1

#main monitor
#monitor=HDMI-A-1,2560x1080@60,0x0,1

#monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

#monitor=eDP-1,disable

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Vanilla-DMZ
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    numlock_by_default = true
    repeat_rate = 200
    repeat_delay = 500
    accel_profile = adaptive

    touchpad {
        natural_scroll = no
        scroll_factor = 3.0
    }

    sensitivity = 0.9
}

general {

    gaps_in = 2
    gaps_out = 10
    border_size = 0
    layout = dwindle
}

decoration {

    rounding = 7

    # inactive settings 
    dim_inactive = true
    dim_strength = 0.25
    
    blur {
        enabled = true
        size = 1
        passes = 4
        contrast = 1.4
    }

    drop_shadow = no
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    #deafult bezier
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    #my bezier
    bezier = scattoStrano, 0.86, 0, 0.07, 1 

    animation = windows, 1, 1, scattoStrano, slide
    #animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 1, default
    animation = borderangle, 1, 1, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 1, scattoStrano, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = yes # you probably want this
}

master {
    new_status = master
}

gestures {
    
    workspace_swipe = false
}

#device:epic-mouse-v1 {
#    sensitivity = -0.5
#}

# window rules
##windowrulev2 = opacity 0.85, class:^(code-oss)$

windowrulev2 = opacity 0.95, class:^(org.telegram.desktop)$
windowrulev2 = float, class:^(org.telegram.desktop)$
windowrulev2 = size 1209 911, class:^(org.telegram.desktop)$
windowrulev2 = move 342 85, class:^(org.telegram.desktop)$

#windowrulev2 = opacity 0.95, class:^(firefox)$
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)
windowrulev2 = size 914 514, class:^(firefox)$, title:^(Picture-in-Picture)  # non funzionano lol

windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 783 516, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = move 1121 17, class:^(org.pulseaudio.pavucontrol)$

windowrulev2 = fullscreen, class:^(feh)$

windowrulev2 = workspace 4, class:^(Spotify)$

windowrulev2 = workspace 5, class:^(com.obsproject.Studio)$

#windowrulev2 = opacity 0.95, class:^(MuPDF)$

# flash problem
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
