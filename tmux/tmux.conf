unbind r
bind r source-file /home/greatbot/.config/tmux/tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
setw -g mouse on
set-option -g status-position bottom


# theme-opts
set -g @dracula-refresh-rate 1
set -g @dracula-show-left-icon " #S"
set -g @dracula-plugins "cwd git battery network"
set -g @dracula-battery-label ""
set -g @dracula-network-ethernet-label ""
set -g @dracula-network-offline-label ""
set -g @dracula-network-wifi-label "󱄙"

run '~/.tmux/plugins/tpm/tpm'
