font_family      family='UbuntuMono Nerd Font' postscript_name=UbuntuMonoNF-Bold
bold_font        family='UbuntuMono Nerd Font' postscript_name=UbuntuMonoNF-Bold
italic_font      family='UbuntuMono Nerd Font' postscript_name=UbuntuMonoNF-BoldItalic
bold_italic_font family='UbuntuMono Nerd Font' postscript_name=UbuntuMonoNF-BoldItalic
font_size 12.0
shell_integration no-cursor
cursor_shape block
#window_padding_width 10

# maps
map ctrl+up change_font_size all +5
map ctrl+down change_font_size all -5
map ctrl+0 change_font_size all 0
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
# bell
enable_audio_bell no

# no warning
confirm_os_window_close 0

# disabled the tab for tmux
# tab bar
#tab_bar_style powerline
#tab_powerline_style slanted
#tab_bar_min_tabs 1

# BEGIN_KITTY_THEME
# One Dark
include dracula.conf
# END_KITTY_THEME
