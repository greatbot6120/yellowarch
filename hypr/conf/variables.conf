# variables
input {
    kb_layout = it,us
    kb_variant =
    kb_model =
    kb_options = grp:alt_space_toggle,caps:swapescape
    kb_rules =

    follow_mouse = 0
    numlock_by_default = true
    repeat_rate = 200
    repeat_delay = 500
    accel_profile = adaptive

    touchpad {
        natural_scroll = no
        scroll_factor = 3.0
    }

    sensitivity = 0.9
}

general {

    gaps_in = 2
    gaps_out = 10
    border_size = 0
    layout = dwindle
}

decoration {

    rounding = 7

    # inactive settings 
    dim_inactive = true
    dim_strength = 0.25
    
    blur {
        enabled = true
        size = 1
        passes = 4
        contrast = 1.4
    }

    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    #deafult bezier
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    #my bezier
    bezier = scattoStrano, 0.86, 0, 0.07, 1 

    animation = windows, 1, 1, scattoStrano, slide
    #animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 1, default
    animation = borderangle, 1, 1, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 1, scattoStrano, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = yes 
}

master {
    new_status = master
}

gestures {
    
    workspace_swipe = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_qtutils_check = true
}
